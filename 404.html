<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirection — ELYM</title>
<meta name="robots" content="noindex">
<script>
  // Capture du path demandé pour que la SPA ELYM ouvre la bonne page
  try {
    sessionStorage.setItem('elym_redirect', window.location.pathname + window.location.search);
  } catch(e){}
  window.location.replace('/');
</script>
<meta http-equiv="refresh" content="0;url=/">

</body>
